OpenIDE-Module-Display-Category=Tools
OpenIDE-Module-Name=AI Agent Bridge for NetBeans
OpenIDE-Module-Short-Description=Claude Code and Codex integration for NetBeans IDE
OpenIDE-Module-Long-Description=\
    Provides an integrated workspace for Claude Code and Codex inside NetBeans IDE. \
    This plugin lets AI agent CLIs run in an embedded terminal, connect to NetBeans through MCP, \
    inspect open projects and editors, preview markdown plans, and review file changes without leaving the IDE. \
    Published by S.O.X.

